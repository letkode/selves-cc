name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please **remove any personal paths or account names** you do not want to share.
        Security problems go through **Security → Report a vulnerability**, not here.
  - type: input
    id: version
    attributes:
      label: selves version
      description: Output of `selves version`
      placeholder: selves-lite 1.3.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and shell
      placeholder: Ubuntu 24.04, bash 5.2
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `selves doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. selves create work
        2. cd ~/project && selves bind work
        3. claude
